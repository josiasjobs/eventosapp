<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EventosAPP — Operação & Direção de Eventos ao Vivo</title>
  <meta name="description"
    content="Aplicação local para operação e gerenciamento em tempo real de eventos ao vivo, mídias e programação em rede local.">
  <meta name="theme-color" content="#000000">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/director.css">
  <link rel="stylesheet" href="css/editor.css">
</head>

<body>

  <div id="app">
    <!-- BARRA DO TOPO -->
    <header class="topbar" id="main-header">
      <span class="brand-mark" aria-hidden="true" data-icon="play" data-icon-size="18"></span>
      <button type="button" class="shift-chip" id="btn-shift-picker" title="Dia e turno" aria-label="Dia e turno">
        <span id="shift-label" class="shift-chip-text">Carregando…</span>
      </button>
      <span class="topbar-spacer"></span>
      <button type="button" class="icon-btn conn-btn is-reconnecting" id="btn-connection" title="Conexão"
        aria-label="Conexão" data-icon="wifi"></button>
      <button type="button" class="icon-btn mode-btn" id="btn-mode-toggle" title="Edição (tecla E)"
        aria-label="Ligar ou desligar a edição" aria-pressed="false" data-icon="pencil"></button>
      <button type="button" class="icon-btn edit-only" id="btn-print-program" title="Imprimir roteiro"
        aria-label="Imprimir roteiro do turno" data-icon="file-text"></button>
      <button type="button" class="icon-btn edit-only" id="btn-open-settings" title="Configurações"
        aria-label="Configurações" data-icon="gear"></button>
    </header>

    <!-- TELA DE OPERACAO -->
    <main class="op" id="main-content">
      <aside class="op-list" id="timeline-container" aria-label="Programação">
        <!-- Rendered by ui-director.js -->
      </aside>

      <section class="op-current" aria-label="Parte atual">
        <div class="op-spotlight" id="spotlight-container">
          <!-- Rendered by ui-director.js -->
        </div>

        <nav class="op-nav" id="director-nav-container" aria-label="Navegação entre partes">
          <!-- Rendered by ui-director.js -->
        </nav>
      </section>
    </main>

    <!-- BOTAO + FLUTUANTE (so com a edicao ligada) -->
    <div class="fab edit-only" id="fab">
      <div class="fab-menu" id="fab-menu" role="menu" hidden>
        <button type="button" class="fab-option" data-fab="item" role="menuitem"><span data-icon="list"></span><span>Parte</span></button>
        <button type="button" class="fab-option" data-fab="media" role="menuitem"><span data-icon="file"></span><span>Mídia</span></button>
      </div>
      <button type="button" class="fab-btn" id="fab-add" title="Adicionar" aria-label="Adicionar"
        aria-haspopup="menu" aria-expanded="false" data-icon="plus"></button>
    </div>

    <!-- TOAST NOTIFICATIONS CONTAINER -->
    <div id="toast-container"></div>
  </div>

  <!-- ============================================== -->
  <!-- MODAL 1: INITIAL SETUP (RF-01)                 -->
  <!-- ============================================== -->
  <div class="modal-backdrop" id="modal-initial-setup" data-autofocus>
    <div class="modal-dialog">
      <form id="form-initial-setup" onsubmit="event.preventDefault(); Modals.submitSetup(this);">
        <div class="modal-header">
          <h2 class="modal-title">Configurar evento</h2>
          <button type="submit" class="icon-btn btn-accent" id="btn-submit-setup" title="Concluir" aria-label="Concluir"
            data-icon="check"></button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="setup-event-name">Nome do evento</label>
            <input type="text" class="form-input" id="setup-event-name" name="eventName" required autocomplete="off">
          </div>
          <div class="form-group">
            <label class="form-label" for="setup-dir-pin">PIN do diretor (4 dígitos)</label>
            <input type="password" class="form-input" id="setup-dir-pin" name="directorPin" inputmode="numeric"
              pattern="[0-9]{4}" maxlength="4" required autocomplete="off">
          </div>
          <div class="form-group">
            <label class="form-label" for="setup-adm-pin">PIN de admin (4 dígitos)</label>
            <input type="password" class="form-input" id="setup-adm-pin" name="adminPin" inputmode="numeric"
              pattern="[0-9]{4}" maxlength="4" required autocomplete="off">
          </div>
          <div id="setup-error-msg" class="form-error" role="alert"></div>
        </div>
      </form>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- MODAL 2: PIN KEYPAD AUTH (RF-02)               -->
  <!-- ============================================== -->
  <div class="modal-backdrop" id="modal-pin-auth">
    <div class="modal-dialog pin-dialog">
      <button type="button" class="icon-btn pin-close" id="pin-close" title="Fechar" aria-label="Fechar"
        data-icon="x" onclick="Modals.close('modal-pin-auth')"></button>
      <div class="pin-mark" aria-hidden="true" data-icon="play" data-icon-size="32"></div>

      <div class="pin-display-wrapper">
        <div class="pin-dots-container" id="pin-dots" aria-label="PIN de 4 dígitos">
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
        </div>
      </div>
      <div id="pin-error-msg" class="pin-msg" role="alert"></div>

      <div class="keypad-grid" id="pin-keypad">
        <button type="button" class="keypad-btn" onclick="Modals.handlePinDigit('1')">1</button>
        <button type="button" class="keypad-btn" onclick="Modals.handlePinDigit('2')">2</button>
        <button type="button" class="keypad-btn" onclick="Modals.handlePinDigit('3')">3</button>
        <button type="button" class="keypad-btn" onclick="Modals.handlePinDigit('4')">4</button>
        <button type="button" class="keypad-btn" onclick="Modals.handlePinDigit('5')">5</button>
        <button type="button" class="keypad-btn" onclick="Modals.handlePinDigit('6')">6</button>
        <button type="button" class="keypad-btn" onclick="Modals.handlePinDigit('7')">7</button>
        <button type="button" class="keypad-btn" onclick="Modals.handlePinDigit('8')">8</button>
        <button type="button" class="keypad-btn" onclick="Modals.handlePinDigit('9')">9</button>
        <button type="button" class="keypad-btn action-btn" title="Limpar" aria-label="Limpar"
          onclick="Modals.handlePinClear()">C</button>
        <button type="button" class="keypad-btn" onclick="Modals.handlePinDigit('0')">0</button>
        <button type="button" class="keypad-btn action-btn" title="Apagar" aria-label="Apagar"
          data-icon="backspace" onclick="Modals.handlePinBackspace()"></button>
      </div>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- MODAL 3: ITEM EDITOR (RF-06)                   -->
  <!-- ============================================== -->
  <div class="modal-backdrop" id="modal-item-editor" data-autofocus>
    <div class="modal-dialog">
      <form id="form-item" onsubmit="event.preventDefault(); Modals.submitItem(this);">
        <div class="modal-header">
          <h2 class="modal-title" id="item-modal-title">Nova parte</h2>
          <button type="button" class="icon-btn" title="Fechar" aria-label="Fechar" data-icon="x"
            onclick="Modals.close('modal-item-editor')"></button>
          <button type="submit" class="icon-btn btn-accent" title="Salvar" aria-label="Salvar"
            data-icon="check"></button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="item-title">Título</label>
            <input type="text" class="form-input" id="item-title" name="itemTitle" required autocomplete="off">
          </div>
          <div class="form-group talk-group">
            <label class="check-label" for="item-is-talk">
              <input type="checkbox" id="item-is-talk" name="itemIsTalk">
              <span>Discurso</span>
            </label>
            <input type="number" class="form-input talk-number" id="item-talk-number" name="itemTalkNumber"
              min="1" step="1" inputmode="numeric" placeholder="Nº" aria-label="Número do discurso" hidden>
          </div>
          <div class="form-group">
            <label class="form-label" for="item-time">Horário</label>
            <input type="time" class="form-input" id="item-time" name="itemScheduledTime" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="item-speaker">Orador</label>
            <input type="text" class="form-input" id="item-speaker" name="itemSpeaker" autocomplete="off">
          </div>
          <div class="form-group">
            <label class="form-label" for="item-description">Observações</label>
            <textarea class="form-textarea" id="item-description" name="itemDescription" rows="3"></textarea>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- MODAL 4: MEDIA EDITOR (RF-07)                  -->
  <!-- ============================================== -->
  <div class="modal-backdrop" id="modal-media-editor" data-autofocus>
    <div class="modal-dialog">
      <form id="form-media" onsubmit="event.preventDefault(); Modals.submitMedia(this);">
        <div class="modal-header">
          <h2 class="modal-title" id="media-modal-title">Nova mídia</h2>
          <button type="button" class="icon-btn" title="Fechar" aria-label="Fechar" data-icon="x"
            onclick="Modals.close('modal-media-editor')"></button>
          <button type="submit" class="icon-btn btn-accent" title="Salvar" aria-label="Salvar"
            data-icon="check"></button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <div class="type-picker" role="radiogroup" aria-label="Tipo de mídia">
              <button type="button" class="type-btn" role="radio" data-type="bible" aria-checked="true" title="Bíblia" aria-label="Bíblia" data-icon="book"></button>
              <button type="button" class="type-btn" role="radio" data-type="video" aria-checked="false" title="Vídeo" aria-label="Vídeo" data-icon="video"></button>
              <button type="button" class="type-btn" role="radio" data-type="image" aria-checked="false" title="Imagem" aria-label="Imagem" data-icon="image"></button>
              <button type="button" class="type-btn" role="radio" data-type="interview" aria-checked="false" title="Entrevista" aria-label="Entrevista" data-icon="mic"></button>
              <button type="button" class="type-btn" role="radio" data-type="theater" aria-checked="false" title="Teatro" aria-label="Teatro" data-icon="drama"></button>
              <button type="button" class="type-btn" role="radio" data-type="other" aria-checked="false" title="Outro" aria-label="Outro" data-icon="file"></button>
            </div>
            <input type="hidden" name="mediaType" value="bible">
          </div>
          <div class="form-group">
            <label class="form-label" for="media-title">Título</label>
            <input type="text" class="form-input" id="media-title" name="mediaTitle" required autocomplete="off">
          </div>
          <div class="form-group">
            <label class="form-label" for="media-ref">Observações</label>
            <input type="text" class="form-input" id="media-ref" name="mediaReference" autocomplete="off">
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- MODAL 5: EVENT SETTINGS            -->
  <!-- ============================================== -->
  <div class="modal-backdrop" id="modal-settings">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title">Configurações</h2>
        <button type="button" class="icon-btn" title="Fechar" aria-label="Fechar" data-icon="x"
          onclick="Modals.close('modal-settings')"></button>
      </div>

      <div class="modal-body settings-list">
        <section class="settings-section">
          <h3 class="settings-heading">Evento</h3>
          <form id="form-settings-general" onsubmit="event.preventDefault(); Modals.submitSettingsGeneral(this);">
            <div class="form-group">
              <label class="form-label" for="settings-event-name">Nome</label>
              <input type="text" class="form-input" id="settings-event-name" name="eventName" required autocomplete="off">
            </div>
            <div class="form-group">
              <label class="form-label" for="settings-event-cat">Categoria</label>
              <input type="text" class="form-input" id="settings-event-cat" name="eventCategory" autocomplete="off">
            </div>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </form>
        </section>

        <section class="settings-section">
          <h3 class="settings-heading">PINs</h3>
          <form id="form-settings-pins" onsubmit="event.preventDefault(); Modals.submitSettingsPins(this);">
            <div class="form-group">
              <label class="form-label" for="new-dir-pin">Novo PIN do diretor (4 dígitos)</label>
              <input type="password" class="form-input" id="new-dir-pin" name="newDirectorPin" inputmode="numeric"
                pattern="[0-9]{4}" maxlength="4" autocomplete="off">
            </div>
            <div class="form-group">
              <label class="form-label" for="new-adm-pin">Novo PIN de admin (4 dígitos)</label>
              <input type="password" class="form-input" id="new-adm-pin" name="newAdminPin" inputmode="numeric"
                pattern="[0-9]{4}" maxlength="4" autocomplete="off">
              <span class="form-hint">Em branco mantém o atual.</span>
            </div>
            <button type="submit" class="btn btn-primary">Salvar PINs</button>
          </form>
        </section>

        <section class="settings-section">
          <h3 class="settings-heading">Backup</h3>
          <button type="button" class="btn btn-secondary settings-block-btn" onclick="Modals.downloadEventBackup()">
            <span data-icon="download"></span><span>Baixar backup (.json)</span>
          </button>

          <div class="form-group settings-restore">
            <label class="form-label" for="backup-file-input">Restaurar a partir de um arquivo .json</label>
            <input type="file" class="form-input" id="backup-file-input" accept=".json,application/json">
            <label class="check-line" for="backup-keep-pins">
              <input type="checkbox" id="backup-keep-pins" checked>
              <span>Manter os PINs atuais</span>
            </label>
            <span class="form-hint">Os dados atuais do evento serão sobrescritos.</span>
            <button type="button" class="btn btn-secondary settings-block-btn" id="btn-restore-backup"
              onclick="Modals.restoreEventBackup(this)">
              <span data-icon="upload"></span><span>Restaurar (toque duas vezes)</span>
            </button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- MODAL 6: LAN QR CODE & NETWORK PAIRING         -->
  <!-- ============================================== -->
  <div class="modal-backdrop" id="modal-lan-connect">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title">Conexão</h2>
        <button type="button" class="icon-btn" title="Fechar" aria-label="Fechar" data-icon="x"
          onclick="Modals.close('modal-lan-connect')"></button>
      </div>

      <div class="modal-body lan-body">
        <div class="lan-qr">
          <img id="lan-qrcode-img" src="" alt="QR Code do endereço da rede local">
        </div>
        <button type="button" class="lan-url" id="lan-url-display" title="Copiar endereço"
          aria-label="Copiar endereço" onclick="Modals.copyLanUrl()">Carregando...</button>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="btn-logout" title="Sair" aria-label="Sair">
          <span data-icon="logout"></span><span>Sair</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- MODAL 7: SCHEDULE PICKER (MOBILE & SELEÇÃO)    -->
  <!-- ============================================== -->
  <div class="modal-backdrop" id="modal-schedule-picker">
    <div class="modal-dialog modal-dialog-schedule">
      <div class="modal-header">
        <h2 class="modal-title">Programação</h2>
        <button type="button" class="icon-btn" onclick="Modals.close('modal-schedule-picker')" title="Fechar"
          aria-label="Fechar" data-icon="x"></button>
      </div>

      <div class="modal-body modal-body-flush">
        <div id="timeline-modal-container">
          <!-- Rendered by ui-director.js -->
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- MODAL: DAY & SHIFT DRAWER                      -->
  <!-- ============================================== -->
  <div class="modal-backdrop" id="modal-shift-picker">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title">Dia e turno</h2>
        <button type="button" class="icon-btn" onclick="Modals.close('modal-shift-picker')" title="Fechar"
          aria-label="Fechar" data-icon="x"></button>
      </div>
      <div class="modal-body modal-body-flush" id="shift-picker-container">
        <!-- Rendered by modals.js -->
      </div>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- MODAL: QUICK FORM (generic)                    -->
  <!-- ============================================== -->
  <div class="modal-backdrop" id="modal-quick-form" data-autofocus>
    <div class="modal-dialog">
      <form id="quick-form" novalidate>
        <div class="modal-header">
          <h2 class="modal-title" id="quick-form-title"></h2>
          <button type="button" class="icon-btn" id="quick-form-cancel" title="Cancelar" aria-label="Cancelar"
            data-icon="x"></button>
          <button type="submit" class="icon-btn btn-accent" title="Salvar" aria-label="Salvar"
            data-icon="check"></button>
        </div>
        <div class="modal-body" id="quick-form-fields"></div>
      </form>
    </div>
  </div>

  <!-- Importar playlist numa parte que já tem mídias -->
  <div class="modal-backdrop" id="modal-import-mode">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title">Importar playlist</h2>
        <button type="button" class="icon-btn" data-import-mode="cancel" title="Cancelar" aria-label="Cancelar"
          data-icon="x"></button>
      </div>
      <div class="modal-body import-choice">
        <p class="import-choice-text" id="import-mode-text"></p>
        <button type="button" class="btn btn-accent" data-import-mode="append"><span data-icon="plus"></span>Adicionar abaixo</button>
        <button type="button" class="btn btn-danger" data-import-mode="replace"><span data-icon="trash"></span>Substituir</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/logic.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/print-program.js"></script>
  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/ui-director.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
